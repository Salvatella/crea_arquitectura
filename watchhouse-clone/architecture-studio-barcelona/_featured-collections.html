<!doctype html>
<html class="" lang="en">
  <!--
    STASH: Secció "Projects destacats" extreta de home/index.html.
    Guardada per reutilitzar-la més endavant. CSS inline a sota.
    Depèn de variables de ../shared/general-styles.css (--site-gutter, --site-gap,
    --site-line, --font-heading, --font-body). Les rutes d'imatge són relatives a home/.
  -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects destacats — stash</title>
    <link rel="stylesheet" href="../shared/general-styles.css">
    <style>
      .featured-card__cta {
        align-items: center;
        display: inline-flex;
        font-size: 13px;
        font-weight: 500;
        gap: 8px;
        width: max-content;
      }

      #featured-collections {
        border-top: 1px solid var(--site-line);
        display: grid;
        gap: var(--site-gap);
        grid-template-columns: repeat(12, minmax(0, 1fr));
        padding: 10px var(--site-gutter) 80px;
      }

      #featured-collections > h2 {
        font-family: var(--font-heading);
        font-size: clamp(30px, 3.15vw, 54px);
        font-weight: 500;
        grid-column: 1 / span 4;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .featured-collections__list {
        display: flex;
        gap: 16px;
        grid-column: 5 / -1;
        overflow-x: auto;
        padding: 0 0 10px;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .featured-collections__list::-webkit-scrollbar {
        display: none;
      }

      .featured-card {
        display: flex;
        flex: 0 0 290px;
        flex-direction: column;
        gap: 8px;
        max-width: 290px;
        min-width: 0;
        scroll-snap-align: start;
      }

      .featured-card img {
        aspect-ratio: 262 / 364;
        height: auto;
        object-fit: cover;
        transition: filter 260ms ease;
        width: 100%;
      }

      .featured-card:hover img {
        filter: brightness(0.86);
      }

      .featured-card__title {
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 500;
        line-height: 1.2;
        margin: 0;
      }

      .featured-card__cta {
        border-bottom: 1px solid var(--site-line);
        border-top: 1px solid var(--site-line);
        display: flex;
        font-size: 11px;
        justify-content: space-between;
        letter-spacing: 0.2em;
        line-height: 1;
        margin-top: -4px;
        min-height: 45px;
        text-transform: uppercase;
        width: 100%;
      }

      .featured-card__cta svg {
        height: 16px;
        width: 16px;
      }

      @media (max-width: 1024px) {
        .featured-card {
          flex-basis: calc((100% - var(--site-gap) * 2) / 2.5);
        }
      }

      @media (max-width: 767px) {
        #featured-collections {
          display: block;
          padding-block: 10px 80px;
        }

        #featured-collections > h2 {
          font-size: 34px;
        }

        .featured-collections__list {
          margin-top: 24px;
          padding-bottom: 10px;
          gap: var(--site-gap);
        }

        .featured-card {
          flex-basis: 70%;
          max-width: 70%;
        }

        .featured-card__title {
          font-size: 14px;
        }
      }

      @media (max-width: 479px) {
        .featured-card {
          flex-basis: 80%;
        }

        .featured-card img {
          aspect-ratio: 4 / 3;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .featured-card img {
          transition: none;
        }
      }
    </style>
  </head>
